model: 'XCLIP_NeuronDeMamba_4'
# ``lp`` freezes only the XCLIP encoder. Mamba and the four-class head remain
# trainable; selected neurons enter Mamba directly with no projection layer.
tuning_mode: 'lp'
task: 'many2many'

# All paths below are relative to the MSLoc_code directory, which is the required
# working directory for the commands in the README.
save_dir: '../MSLoc_data/DeMamba/results/xclip_neurons_4'
neuron_indices_path: '../MSLoc_data/DeMamba/neuron_probe/xclip_neuron_indices.json'
xclip_model_path: '../MSLoc_data/DeMamba/pretrained_weights/xclip-base-patch16'

max_epoch: 10
bath_per_epoch: 1000
train_batch_size: 32
val_batch_size: 32
num_workers: 32
lr: 0.000001

train_json_path: '../MSLoc_data/data/Tasle-CoT-10K/annos/train_all_1209.json'
test_json_path: '../MSLoc_data/data/Tasle-CoT-10K/annos/test_all_1209_0119.json'
dataset_base_path: '/mnt/gemininjceph3/geminicephfs/mmsearch-luban-universal/group_2/user_sleepfeng/0826/dataset/Tasle-CoT-10K/video_frames'
window_length: 2.0
frames_per_window: 8
mode: 'four_class'
transform_config: {
  crop_youku: True,
  normalization: 'clip'
}
